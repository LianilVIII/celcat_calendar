name: Update CELCAT calendar

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes (GitHub may delay scheduled runs by a few minutes).
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS file
        run: >
          python scripts/update_calendar.py
          --output calendar.ics
          --json-output "$RUNNER_TEMP/events.json"
          --exclude-module "4TIN914U Logic and languages"

      - name: Sync Google Calendar
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && env.GOOGLE_CALENDAR_ID != '' }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/sync_google_calendar.py --events "$RUNNER_TEMP/events.json"

      - name: Commit updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet && exit 0
          git commit -m "chore: update generated calendar.ics"
          git push
